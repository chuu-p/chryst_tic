[package]
name = "chryst"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
buddy-alloc = { version = "0.4.1", optional = true }
itertools = "0.14.0"
rhai = { version = "1.24.0", default-features = false, features = ["std"] }
shipyard = "0.11.2"

[profile.release]
lto = true
strip = true

[features]
# use `--no-default-features` or comment out next line to disable allocator
default = ["buddy-alloc"]
